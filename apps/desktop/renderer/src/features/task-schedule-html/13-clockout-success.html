<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>准点跑路成功｜不要加班</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="screen-stage page-13" data-screen="13-clockout-success">
    <section class="pixel-frame success-dialog" aria-label="跑路成功结算">
      <div class="pixel-inner">
        <div class="success-mark"><img class="pixel-source-icon" src="assets/pixel-source/success-mark.png" alt="像素对勾和庆祝闪光"></div>
        <h1>准点跑路成功</h1>
        <p class="success-time">18:28 · 提前 2分钟</p>
        <h2>今天胜利</h2>
        <section class="result-rows" aria-label="今日结果">
          <div><span class="icon i-clipboard-check" aria-hidden="true"></span><span>承诺任务　5/5</span><div class="progress-segments" aria-hidden="true"><span class="is-complete"></span><span class="is-complete"></span><span class="is-complete"></span><span class="is-complete"></span><span class="is-complete"></span></div></div>
          <div><span class="icon i-moneybag" aria-hidden="true"></span><span>今日获得窝囊费</span><strong>+¥88.00</strong></div>
          <div><span class="icon i-clock" aria-hidden="true"></span><span>准点奖池奖励：待 18:35 结算</span><span></span></div>
          <div><span class="icon i-users" aria-hidden="true"></span><span>好友将看到：<strong>已跑路</strong></span><span class="icon i-run result-run-icon" aria-hidden="true"></span></div>
        </section>
        <div class="day-timeline" aria-label="今日时间线"><span><strong>09:00</strong><small>上班</small></span><span><strong>12:00</strong><small>午休</small></span><span><strong>18:28</strong><small>跑路</small></span></div>
        <div class="success-actions"><button class="btn btn-primary" type="button" data-link="05-task-list.html">收工</button><button class="btn" type="button" data-action="view-record">查看今天记录</button></div>
        <p class="settlement-hint"><span class="icon i-sparkles" aria-hidden="true"></span>奖励结算完成后会静默入账。</p>
        <p class="screen-status" role="status" data-status></p>
      </div>
    </section>
    <img class="pet pixel-art" src="../../../public/assets/capybara/celebrate.png" alt="举起双爪庆祝的像素水豚">
  </main>
</body>
</html>
